name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------------
  # Python: lint + unit tests
  # -------------------------------------------------------------------------
  python:
    name: Python lint & tests
    runs-on: ubuntu-22.04
    env:
      PIPENV_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Lint (ruff)
        run: ./scripts/lint_python.sh

      - name: Unit tests (pytest)
        run: ./scripts/test_python.sh

  # -------------------------------------------------------------------------
  # C++: build + unit tests + end-to-end tests
  # -------------------------------------------------------------------------
  cpp:
    name: C++ build & tests
    runs-on: ubuntu-22.04
    env:
      PIPENV_PYTHON: python
      VCPKG_INSTALLATION_ROOT: /usr/local/share/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and GL/X11 headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev

      - name: Build cadvis
        run: ./scripts/build_cpp.sh

      - name: C++ unit tests
        run: ./scripts/test_cpp.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Python dependencies
        run: pipenv install

      - name: End-to-end tests
        run: ./scripts/test_e2e.sh
