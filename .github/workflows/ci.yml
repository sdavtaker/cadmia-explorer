name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

jobs:
  # -------------------------------------------------------------------------
  # Python: lint + unit tests
  # -------------------------------------------------------------------------
  python:
    name: Python lint & tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv==2023.12.1

      - name: Lint (ruff)
        run: pipenv install --dev && ./scripts/lint_python.sh

      - name: Unit tests (pytest)
        run: pipenv install --dev && ./scripts/test_python.sh

  # -------------------------------------------------------------------------
  # C++: build + unit tests + end-to-end tests
  # -------------------------------------------------------------------------
  cpp:
    name: C++ build & tests
    runs-on: ubuntu-24.04
    env:
      PIPENV_PYTHON: python
      PIPENV_VENV_IN_PROJECT: "1"
      VCPKG_INSTALLATION_ROOT: /usr/local/share/vcpkg
      VCPKG_FORCE_SYSTEM_BINARIES: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap vcpkg if not pre-installed
        run: |
          if [ ! -f "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            VCPKG_INSTALLATION_ROOT="${GITHUB_WORKSPACE}/vcpkg"
            echo "VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "${GITHUB_ENV}"
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_INSTALLATION_ROOT}"
            git -C "${VCPKG_INSTALLATION_ROOT}" checkout 67b207f199b5d2ee09f206d2e9e9171e7c7a3274
            "${VCPKG_INSTALLATION_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install build tools, GL/X11 headers, and clang-18 lint tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev \
            clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy

      - name: Build cadvis
        run: ./scripts/build_cpp.sh

      - name: C++ lint (clang-format + clang-tidy)
        run: ./scripts/lint_cpp.sh

      - name: C++ unit tests
        run: ./scripts/test_cpp.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv==2023.12.1

      - name: Install Python dependencies
        run: pipenv install

      - name: End-to-end tests
        run: ./scripts/test_e2e.sh

  # -------------------------------------------------------------------------
  # Gate job — required status check for branch protection
  # -------------------------------------------------------------------------
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    needs: [python, cpp]
    steps:
      - run: echo "All checks passed"
