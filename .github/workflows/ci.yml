name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------------
  # Python: lint + unit tests
  # -------------------------------------------------------------------------
  python:
    name: Python lint & tests
    runs-on: ubuntu-24.04
    env:
      PIPENV_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Lint (ruff)
        run: ./scripts/lint_python.sh

      - name: Unit tests (pytest)
        run: ./scripts/test_python.sh

  # -------------------------------------------------------------------------
  # C++: build + unit tests + end-to-end tests
  # -------------------------------------------------------------------------
  cpp:
    name: C++ build & tests
    runs-on: ubuntu-24.04
    env:
      PIPENV_PYTHON: python
      VCPKG_INSTALLATION_ROOT: /usr/local/share/vcpkg
      VCPKG_FORCE_SYSTEM_BINARIES: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg if not pre-installed
        run: |
          if [ ! -f "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            VCPKG_INSTALLATION_ROOT="${GITHUB_WORKSPACE}/vcpkg"
            echo "VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "${GITHUB_ENV}"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_INSTALLATION_ROOT}"
            "${VCPKG_INSTALLATION_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install build tools, GL/X11 headers, and clang-18 lint tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev \
            clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy

      - name: Build cadvis
        run: ./scripts/build_cpp.sh

      - name: C++ lint (clang-format + clang-tidy)
        run: ./scripts/lint_cpp.sh

      - name: C++ unit tests
        run: ./scripts/test_cpp.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Python dependencies
        run: pipenv install

      - name: End-to-end tests
        run: ./scripts/test_e2e.sh
