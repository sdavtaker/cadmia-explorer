name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 9 * * 1'

permissions: {}

jobs:
  analyze-python:
    name: Analyze (Python)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: "/language:python"

  analyze-cpp:
    name: Analyze (C++)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    env:
      VCPKG_INSTALLATION_ROOT: /usr/local/share/vcpkg
      VCPKG_FORCE_SYSTEM_BINARIES: "1"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: c-cpp

      - name: Bootstrap vcpkg if not pre-installed
        run: |
          if [ ! -f "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            VCPKG_INSTALLATION_ROOT="${GITHUB_WORKSPACE}/vcpkg"
            echo "VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "${GITHUB_ENV}"
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_INSTALLATION_ROOT}"
            git -C "${VCPKG_INSTALLATION_ROOT}" checkout 67b207f199b5d2ee09f206d2e9e9171e7c7a3274
            "${VCPKG_INSTALLATION_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install build tools and GL/X11 headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev

      - name: Build cadvis
        run: ./scripts/build_cpp.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: "/language:c-cpp"
